checker {
    algo=incremental
    discard-disabled=true
    length=10
    max-error=1
    no-deadlocks=false
    smt-encoding {
        type=oopsla-19
    }
    timeout-smt-sec=0
    tuning {
        "search.outputTraces"="false"
    }
}
common {
    command=check
    debug=true
    features=[]
    out-dir="/home/alexandre.siret/Accord/AccordTLASpec/SpecAccord/apalacheVersion/_apalache-out"
    profiling=false
    smtprof=false
    write-intermediate=false
}
input {
    source {
        file="AccordSpec.tla"
        format=tla
        type=file
    }
}
output {}
server {
    port=8822
    server-type {
        type=checker-server
    }
}
tracee {}
typechecker {
    inferpoly=true
}
