SPECIFICATION Spec

CONSTANTS
    Proc = {1, 2, 3, 4, 5}        \* Set of processes
    F = 2                       \* Max # crash failures
    E = 2                             \* e-fast parameter 
    Id = {1,2,3}                    \* Command identifiers
    NumberOfRecoveryAttempts = 1
    \* InitTimestamp[i], to change it, set InitTimestamp in the spec file, I can't define it here
    
    \* The constants defined from this point on should not be changed.
    \* Special value constants
    Nop =  0
    Bottom = bottom                     \* Special value representing no command
    NoProc = 0                    \* Special value representing no process
    \* Message Type contants
    TypePreAccept = 1
    TypePreAcceptOK = 2
    TypeAccept = 3
    TypeAcceptOK = 4
    TypeCommit = 5
    TypeCommitOK = 6
    TypeStable = 7
    TypeRecover = 8
    TypeRecoverOK = 9
    \* Phases
    InitialPhase = 1
    PreAcceptedPhase = 2
    AcceptedPhase = 3
    CommittedPhase = 4
    StablePhase = 5
    \* Fast and SlowPath constants
    Fast = 0
    Slow = 1

INVARIANT Agreement
INVARIANT Ordering
INVARIANT PartialOrder
INVARIANT Acyclicity


CHECK_DEADLOCK FALSE 
